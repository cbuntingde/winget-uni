name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No SDK version pinned: setup-dotnet honours global.json, so CI builds
      # with the same SDK family the repository pins.
      - uses: actions/setup-dotnet@v4
      - run: dotnet build WingetUni.sln -c Release --nologo
      - run: dotnet test WingetUni.sln -c Release --no-build --nologo

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
      - run: dotnet publish src/WingetUni.App/WingetUni.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - run: Compress-Archive -Path dist/win-x64/* -DestinationPath "WingetUni-${{ github.ref_name }}-win-x64.zip"
      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes "WingetUni-${{ github.ref_name }}-win-x64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
